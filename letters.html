<html lang="id">
<head>

<style>
/* Semua class diawali "lta-" supaya tidak bentrok dengan CSS lama */
:root{
  --lta-sun:#eab308; --lta-amber:#f59e0b; --lta-butter:#fde047;
  --lta-brown:#5b3a12; --lta-font:"Fredoka","Baloo 2",system-ui,sans-serif; --lta-gold:#b8860b; --lta-cream:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--lta-font);color:var(--lta-brown);
  background:var(--lta-cream);
  background-image:radial-gradient(rgba(245,158,11,.14) 1.5px,transparent 1.5px);
  background-size:26px 26px;min-height:100vh;overflow-x:hidden}

/* ===== NAV (gaya pill seperti halaman utama) ===== */
.lta-nav{display:flex;justify-content:center;padding:14px 12px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20}
.lta-pill{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;border-radius:999px;
  background:rgba(60,60,60,.9);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lta-pill a{font-family:var(--lta-font);font-weight:700;font-size:.9rem;color:#fff;text-decoration:none;
  text-transform:uppercase;padding:10px 20px;border-radius:999px;transition:background .2s}
.lta-pill a:hover{background:rgba(255,255,255,.14)}
.lta-pill a[aria-current="page"]{background:#ffd45e;color:#3b3b3b}
@media(max-width:480px){.lta-pill a{padding:8px 13px;font-size:.76rem}}

/* ===== BACKGROUND FOTO GELAP ===== */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65)),
    url("bg-letters.jpg.jpeg") center/cover no-repeat;
}
.lta-hero p{color:#fff;opacity:.95}
  
  
  /* ===== HERO ===== */
.lta-hero{position:relative;text-align:center;padding:56px 20px 28px}
.lta-hero h1{margin:0;font-size:clamp(2rem,6vw,3.6rem);line-height:1.1;
  background:linear-gradient(90deg,var(--lta-gold),var(--lta-amber),var(--lta-sun));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lta-hero p{margin:12px auto 0;max-width:520px;font-style:italic;opacity:.85}
.lta-corner{position:absolute;width:clamp(70px,14vw,130px);opacity:.9;animation:lta-sway 6s ease-in-out infinite}
.lta-corner.tl{top:6px;left:6px}
.lta-corner.tr{top:6px;right:6px;transform:scaleX(-1);animation-delay:-3s}
@keyframes lta-sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.lta-divider{display:flex;align-items:center;gap:14px;max-width:420px;margin:18px auto 0;color:var(--lta-amber)}
.lta-divider::before,.lta-divider::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--lta-amber),transparent)}

/* ===== GRID ===== */
.lta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;
  max-width:1100px;margin:0 auto;padding:20px 18px 70px;list-style:none}
.lta-card{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:center;
  background:#fff;padding:10px 10px 12px;border:2px solid #f3e3a0;border-radius:16px;
  box-shadow:0 3px 10px rgba(91,58,18,.12);transition:transform .25s,box-shadow .25s,border-color .25s}
.lta-card:hover,.lta-card:focus-visible{transform:translateY(-6px) scale(1.04);border-color:var(--lta-sun);
  box-shadow:0 0 0 3px var(--lta-butter),0 12px 28px rgba(245,158,11,.5)}
.lta-photo{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#fef3c7}
.lta-photo img,.lta-photo svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.lta-card:hover .lta-photo img{transform:scale(1.1)}
.lta-name{display:block;margin-top:10px;font-weight:700;font-size:.95rem}

/* ===== MODAL ===== */
.lta-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(60,35,5,.6);backdrop-filter:blur(3px)}
.lta-modal.open{display:flex;animation:lta-fade .25s}
@keyframes lta-fade{from{opacity:0}to{opacity:1}}
.lta-dialog{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;display:grid;
  grid-template-columns:240px 1fr;gap:22px;padding:26px;background:var(--lta-cream);
  border:3px solid var(--lta-sun);border-radius:20px;box-shadow:0 0 40px rgba(253,224,71,.6);
  animation:lta-pop .3s}
@keyframes lta-pop{from{transform:scale(.9) translateY(14px);opacity:0}}
.lta-dialog .lta-photo{border-radius:14px;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lta-dialog h2{margin:0 0 10px;font-size:1.6rem;color:var(--lta-gold)}
.lta-letter{white-space:pre-line;line-height:1.7;padding:16px 18px;border-radius:6px;min-height:150px;
  background:#fffef5 repeating-linear-gradient(transparent 0 27px,rgba(245,158,11,.25) 27px 28px);
  border-left:4px solid var(--lta-amber);box-shadow:inset 0 0 14px rgba(245,158,11,.12)}
.lta-actions{display:flex;gap:8px;margin-top:14px}
.lta-btn{cursor:pointer;border:0;border-radius:999px;padding:9px 18px;font:700 .9rem var(--lta-font);
  background:var(--lta-butter);color:var(--lta-brown);transition:background .2s,transform .2s}
.lta-btn:hover{background:var(--lta-sun);transform:translateY(-2px)}
.lta-close{position:absolute;top:10px;right:10px;background:var(--lta-amber);color:#fff}
@media(max-width:620px){.lta-dialog{grid-template-columns:1fr}.lta-dialog .lta-photo{max-width:220px;margin:0 auto}}

/* ===== KELOPAK JATUH ===== */
.lta-petals{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lta-petal{position:absolute;top:-30px;width:12px;height:20px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;
  background:linear-gradient(var(--lta-butter),var(--lta-amber));opacity:.8;animation:lta-fall linear infinite}
@keyframes lta-fall{to{transform:translate(var(--drift),110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.lta-petals{display:none}.lta-corner,.lta-card,.lta-dialog{animation:none;transition:none}}
</style>
</head>

  { name: "Angela", photo: "Foto/angela.jpg", letter: "Hai, Angel! Angel, KAMU KEREN SEKALIYY!! Si paling lembut hatinya dan si gemas hihihi. Maybe accounting wasn't always easy for you in the beginning, but look at you now! Who would've thought that accounting would bring out such a hardworking, diligent, and eager-to-learn side of Angel? U DID AMAZING, ANGEL!  Thank you for bringing so much color to Amigos and making our days a little brighter. Semoga kamu selalu langgeng ya, Angel! Semoga OJT Angel menyenangkan, Angel bisa belajar banyak hal baru, dan yang terpenting..Angel selalu happy! And please remember, Amigos will always be proud of you, Angel! I'm sure the little Angel from Cawu 1 would be so proud to see how far you've come today. Keep growing, keep shining, and keep being our lovely Angel! " },

  { name: "Lisia", photo: "Foto/lisia.jpg", letter: "Holaa Lisiaa!!! Gilss our kurkul abadi yang sekarang jadi Wakomti di cawu 6!! Thank you for always being Lisia in every situation yaa liss, gak berasa yaa banyak banget yang lu jalani disini dari kepanitiaan, organisasi, kelas, dll. Walaupun ada naik turunnyaa dan masa masa kelamnyaa tapi lu selalu bawa happy dan enjoy semuanyaa!! Itu yang buat lu selalu menjadi yang terbaik in every situation lis, KEREN PWOLL!! Thank you jugaa Lisia sudah mau jadii Wakomti Abadi di Cawu 6 hohoho, banyak bangett hal yang sudah AMI7Y lalui, tapi semuanya terbantu karena ada lu Lis!! So proud dan happy Amity punya Lisia yang selalu helpful dan menyediakan ribuan solusi HAHAHAH. Tetap menjadi Lisia kapanpun dan dimanapun yaa Lis, setiap perjalanan dan memori hidup lu tentang AMITY jugaa jangan dilupain sampe nenek nenek yaa!! Semoga di next chapter kehidupan lu nantinya akan terus banyak hal baik berdatangan dan lu terus menjadi terang berkat bagi banyak orang yaa Lis!! Semangatt OJT, SKRIPSI, PENEMPATAN DAN LAINNYAA!! Always be Lisia and do ur best even when the world didn’t give u any chance!!(*^_^*)" },
  { name: "Cungfinius", photo: "Foto/cungfinius.jpg", letter: "Woii bocill AMI7Y!! Anak kecil yang dari dulu sangat egois dan jaga jarak dengan semua orang :P. Keren lu Cung, jadi anak bontot dari 1 angkatan ini dan masih survive sampe sekarang dan bahkan lu jadi pribadi yang lebih baik sampe saat ini!! So proud of u cung, banyak hal yang merubah hidup lu dan pandangan lu disini. AMI7Y rasanya kurang kalo gaada lu, dan kelas ini menjadi saksi disaat kondisi lu tidak baik baik sajaa, lu belajar gimana caranya berteman, lu belajar gimana caranya menghargai orang lain dan yang paling penting adalah lu belajar menemukan jati diri lu dan menjadikan AMITY menjadi keluarga lu ( •̀ ω •́ ). Remember our journey together yaa cung, tiap hal yang lu lalui disini, naik turun perjalanan hidup lu, lu tau selalu ada AMIGOS yang bersama lu dan jadi tempat bercerita lu. Tetap menjadi Cung cung yang baik dan selalu menjadi lebih baik setiap harinya yaa! Walaupun lu anak bontot, lu bisa membuktikan kalo umur bukan hanya sekedar angka yang bisa disepelekan, dan lu berhasil membuktikan lu bisa sampai saat ini. Part kehidupan selanjutnya akan dijalani dan mungkin lu tetap menjadi anak bontot di lingkungan yang baru, selalu ingat bahwa diri lu dibentuk dan berasal dari AMITY yang selalu supportif dan selalu mau menjadi lebih baik. Semoga di langkah berikutnyaa akan banyak hal baik yang menanti yaa, karma baik yang selama ini ada biarlah menjadi pupuk untuk masa depan lu nanti. Semangatt OJT, SKRIPSI, PENEMPATAN DAN LAINNYAA!! Always be Cung cung di BP 7 and do ur best even when the world didn’t give u any chance!! U_U" },
  { name: "David", photo: "Foto/david.jpg", letter: "Hellooww Dapitt!! Wakomti Cawu 3 yang gacorr abis dan menjadi punggawa ITL Cawu akhir!! Jujurr AMI7Y punya banyak orang pinter dan baik hati, tapi yang pinter, ganteng dan  jago nyanyi cuma lu doang pit (RESPECT)!! Lu keren banget, salah satu orang yang berani bersuara dan menanggapi dosen, pemikiran kritis yang lu punya bisa banget jadi senjata dan pijakan lu untuk terus bertumbuh dan berkembang nanti. Selalu ingat AMI7Y yang selalu ada di core memories hidup lu yaa pit, lu bertemu Angel disini, lu menemukan Badboys dan temen temen lain yang selalu menemani hari hari lu dan yang terpenting, lu menemukan jati diri lu disini. Remember our journey together yaa Pit, tiap hal yang lu lalui disini, naik turun perjalanan hidup lu, lu tau selalu ada AMIGOS yang barenglu dan jadikan tempat bercerita lu. Tetap menjadi Dapit yang kritis dan suka nyanyi yaa, walaupun dunia lgi mau runtuh rasanya, AMIGOS selalu terbuka untuk lu pit. Semoga di langkah berikutnyaa akan banyak hal baik yang menanti yaa pit, hal hal baik yang selama ini lu lakuin biarlah menjadi pupuk untuk masa depan cerah lu nanti. Semangatt OJT, SKRIPSI, PENEMPATAN DAN LAINNYAA!! Always be Dapit di BP 7 and do ur best even when the world didn’t give u any chance!! U_U" },
  { name: "Celine", photo: "Foto/celine.jpg", letter: "Hi Celinpung!! Komti Pertama AMI7Y yang sangat merangkul dan memasang badan untuk AMIGOS dari awal!! Thank you atas tangan hangat lu yang selalu menjaga AMI7Y yaa celine, awalnya emang Jamet tapi sampe sekarang juga masih sih… TAPI PPBP 7 gaakan ada sampai sekarang dan gaakan bertahan sampai sekarang kalau bukan lu yang mengawali ini semua Celine (HORMAT!!). Ibarat Indonesia, lu udah jadi Bapak Proklamator nya cel. Banyak hal yang sudah lu lalui dari Cawu 1 sampe sekarang dan AMIGOS tau lu sayang dan cinta banget dengan kelas ini, kami bersyukur punya Leader yang tepat untuk selalu merangkul dan menjaga kita dari awal. Semoga AMIGOS selalu jadi core memories dalam hati dan pikiran lu yaa Celine, mungkin banyak hal baik dan buruk terjadi selama kita bersama, tapi kita tau dan lu juga tau, kita akan terus bersama sama. Jalan pagi, ngalam dan berbagai macam yang lu lakuin dan mampu menginfluence orang banyak juga untuk melakukan itu, itu bukan hal yang dimiliki semua orang Celine, lu bisa jadi orang itu, lu bisa membawa AMI7Y jadi jauh lebih baik. Thank you yaa Cel sudah baik dan selalu baik. Tetap jadi Celine yang AMIGOS kenal yaa, tetap jadi Celine yang tegar, ceria dan effort di setiap hal yang dilakukan!! Jangan minder dan takut dengan hal baru, karena AMIGOS selalu bersama lu Cel. Semoga di langkah berikutnyaa akan banyak hal baik yang menanti yaa Cel, hal hal baik yang selama ini lu tabur biarlah menjadi pupuk untuk dituai di masa depan cerah lu nanti. Semangatt OJT, SKRIPSI, PENEMPATAN DAN LAINNYAA!! Always be Celingg di BP 7 and do ur best even when the world didn’t give u any chance!! U_U" },
  { name: "Finnetha", photo: "Foto/finetha.jpg", letter: "Haiii taaa!!! Ga kerasa yaaa uda 2.5thn aja di PPBP ini. Rasanya pasti ada banyak momen yang udh dilewatin selama perjalanan ini. Mungkin ada hari-hari yang bikin u hepi bgt n ada jg yg bikin u sedih n cape bgt (meskipun aslinya banyakan ini x ya WKWKKW). Tp, semuanya pasti ada banyak hal yang bisa dikenang dan dipelajari. Mungkin orang2nya, pengalamannya, bahkan masalah2 yg mungkin baru pernah dihadepin. Thank you yaa taa for being part of this journey. Terima kasih udh kasi waktu, tenaga , semuanya buat PPBP. Semoga apa yg dialami disini bisa jd bekel buat u kedepannya. For your next chapter, hope you find more happiness, courage, and opportunities to grow. Semoga segala hal yang u pengenin bisa tercapai, selalu dikelilingi orang-orang baik, dan diberikan kelancaran dalam setiap langkah ke depannya. Remember that this is not the end of everything. Once a part of PPBP, always a part of PPBP! Wishing you nothing but the best, Tata! We will miss you! " },
  { name: "Florenza", photo: "Foto/florenza.jpg", letter: "Floooo!! ❤️ Akhirnya sampai juga di titik ini yaa! Setelah melewati berbagai proses dan pengalaman selama di PPBP, pasti ada banyak cerita yg bakal selalu km inget. Mungkin ada hal2 yg dulu terasa sulit, ada momen yg bikin seneng banget, atau bahkan pengalaman yg nggak pernah kepikiran sebelumnya. Atau mungkin hal2 yg menyakiti km selama ini. But hope you know that every little thing you've been through has brought you to where you are today. Thank you for all the contributions and memories you've shared selama di PPBP! Semoga setelah ini km bisa terus explore banyak hal baru, berani ambil kesempatan, dan nggak berhenti berkembang. Jangan lupa buat menikmati setiap prosesnya, celebrate your little achievements, and be proud of how far you've come. Good luck for everything ahead, Flooo! Semoga semua hal baik selalu menyertai langkahmu ke depannya. Sending lots of love!! 🥹" },
  { name: "Hellen", photo: "Foto/hellen.jpg", letter: "OMGGG HELLENNNNNNN💗 I hope you know that you are loved and appreciated more than you realize. Selama 2,5 tahun di PPBP, pasti ada banyak hal yg udah kamu lewati, baik yg menyenangkan maupun yg mungkin nggak mudah buat dijalanin. And even if things aren't going well for you right now, or maybe you're feeling sad and overwhelmed, please remember that this is not where your story ends. Masih banyak hal baik yg sedang menunggu kamu di depan sana, so please don't give up on yourself! Kamu juga nggak harus menghadapi semuanya sendirian, karena kamu punya Amigos yg bakal selalu siap nemenin, dengerin cerita kamu, dan bantu kamu 24/7 whenever you need us. Thank you for being part of this journey, Hellen! Semoga ke depannya kamu selalu dikelilingi kebahagiaan, orang2 baik, dan kesempatan2 baru yg membawa kamu ke hal-hal luar biasa. We're always rooting for you!! 🌻🌞" },
  { name: "Intan", photo: "Foto/intan.jpg", letter: "MIHH KAK TANGGG!!!💗 One thing that I really admire about you is how much you've grown throughout this journey! Dari awal masuk sampai sekarang, aku ngerasa ada perkembangan yg signifikan bgt sama km WOIIII. You're becoming more confident, more courageous, and no longer afraid to show what you're capable of (Asek makasi gpt udh bantu bikin english biar lbh keren). Apalagi klo udah urusan dance, BEUHHH mengalahkan jennie blackmamba nokk. Semoga ini bikin km kedepannya buat engga ragu lg buat show off kecentilan dan kelenturan dance km, because you have so much to offer #ASEKK. Trs makasi ya tan udh meladeni ocehanku di grup kiyowo selalu WKWKKWKW. Disaat org lg belajar, hanya kamulah yg mengerti kegabutan ini. WWKWKWK. Meskipun di hari2 akhir ada banyak drama yg perlu dilewati, tunjukkanlah taringmu itu OAKWOWKOW n SEMANGATT KOOR PERFORMM💃🧑‍🩰(kalau boleh req ada gaya ini dong kak tang wwkwkw). Thank you for all the memories and everything you've shared selama di PPBP! Semoga ke depannya dihampiri semakin kesempatan buat shine even brighter. Keep dancing, keep growing, and keep being you, Intannn!! So proud of you!! 🥹🫶🏻" },
  { name: "Jelita", photo: "Foto/jelita.jpg", letter: "KAK JELLLLL!! 😭❤️ First of all, I think one thing that everyone will remember about you is our WTS-ersss. Yang selalu siap wts makanan apapun n kapanpunnn WKWKKW. Literally our 24/7 food station!! WKWKWK. But jokes aside, thank you for always being someone who's helpful and willing to lend a hand (bener2 definisi sayap tak bermalaikat #ASEKKKKKKKK AOKWOWKOWKW) tp ini RIYALLLL super duper helpful spt handymandy. Apalagi jokesnya itu beuhhh legit sangatttt n freshh from the penggorengan. Semoga setelah ini Kak Jel selalu diberikan kebahagiaan, kesehatan, dan kelancaran dalam setiap langkah. Whatever comes next,  hope you never lose your kindness and willingness to share with others. God bless you in everything you do! Khusus buat kak jel, mau titip satu ayat dari Amsal 16:3 nih, Commit to the Lord whatever you do, and He will establish your plans. Semoga setiap rencana dan langkah Kak Jel ke depannya selalu Tuhan tuntun dan sertai. Keep spreading kindness and happiness wherever you go, Kak Jelll!! 🥹💗" },
  { name: "Jevan", photo: "Foto/jevan.jpg", letter: "JEPUNNNNN!! WKWKWK 🤣 Gak nyangka yaa perjalanan 2,5 tahun di PPBP udah mau sampai di penghujungnya. Btw, satu hal yg cukup berkesan dari lu tuh perubahan personality lu HAHAHA. Dulu rasanya ada aja bahan lawakan yg keluar, tp semenjak sama Kaba kok malah makin cool yaaa??? WKWKWK. Tp gapapa, medok Magelang lu tetep jadi ciri khas yg gak bakal ilang 😭. Thank you udah jadi bagian dari perjalanan PPBP dan segala cerita di dalamnya! Semoga ke depannya semua urusan lu dilancarkan, makin sukses, dan selalu dikelilingi hal2 baik. Khusus buat lu dan Kaba, semoga hubungannya makin langgeng, saling support, dan bisa terus bersama sampai ke pelaminan. AAMIINNN!! Tp inget, klo udh nikah JANGAN LUPA UNDANG AMIGOS YAAA!! WKWKWK. Good luck for everything ahead, JEPUNKKKKKK!!!" },
  { name: "Joshua", photo: "Foto/joshua.jpg", letter: "KIMM JOSHHHHH 😭 WKWKWK. Kayaknya gak perlu dijelasin lagi kenapa lu sering dipanggil Oppa, soalnya vibe nonchalant + macho lu (ASEK) emg udah mendukung bgt HAHAHA. Ditambah rajin nge-gym, makin lengkaplah paket oppa Korea-nya 😭. Anyway, thank you udah jadi bagian dari perjalanan PPBP dan udah ikut bikin banyak cerita selama 2,5 tahun ini. Semoga ke depannya lu makin sukses, makin sehat, dan semua yg lu usahain bisa berjalan lancar. And of course, semoga segera dipertemukan sama jodoh yg tepat, yg bisa tahan sama ke-oppa-an lu WKWKWK. Jangan lupa tetep jadi Joshua yg kita kenal, dan semoga perjalanan setelah PPBP ini dipenuhi banyak hal baik. Good luck for everything ahead, Oppaaa!! 🫡" },
  { name: "Jovanka", photo: "Foto/jovanka.jpg", letter: "HELOO JOJOOOO!!! Kalau ngomongin Jojo, pasti ada aja tingkah lucu yg bikin suasana jadi rame WKWKWK. Salah satu orang yg kalau dikasih tugas kayaknya jarang banget nolak, apalagi waktu di kelompok DM (mau2 aja jd korban bully WKWKKW, bahkan smpe disirem aerrr😭😭😭. THANKYOU PENGORBANANNYAAAA) gk salah sih lu sampai dipercaya jadi koor logistik. Salut sih sama kemauan lu buat selalu ikut turun tangan dan bantu apa pun yg dibutuhin. Tapi di balik jiwa gercep dan siap ditugasinnya itu, ada satu bakat yg gak kalah konsisten, yaitu TIDUR DI KELAS 😭 WKWKWK. Semoga kebiasaan satu ini bisa sedikit dikurangi ya, Jojo HAHAHA. Anyway, semoga semua pengalaman selama di PPBP bisa jadi bekal dan kenangan baik buat perjalanan lu selanjutnya. Makin sukses, makin banyak kesempatan baru dan 1 doa spesial khusus buat lu dan ko Toto, semoga makin langgeng, saling support, dan semoga bisa terus bersama sampai pelaminan. Kalau udah waktunya, AMIGOS JANGAN SAMPAI KELEWAT UNDANGANNYA!! WKWKWK. All the best, Jojooo!! 🫡" },
  { name: "Kaba", photo: "Foto/kaba.jpg", letter: "Haii Kabaa!! Ba gilaa sii lu orang gokill bangettt masih sibuk sampai tahun depan, makasii bangett udah sangat bekerja keras untuk kesuksesan acara gradu kita nanti ba. Gue tau lu pasti udah dan akan selalu ngasih yang terbaik buat kita semuaa. Dann gue suka bangett sama editan editan lu tiap presentasi, apalagi ide ide lu selalu mantepp banget baa sumpil ini mahh kerenn woiii. Congratsss udah melewati segala ups and downs di ppbp ini ba. Dan kita semua tau lu mati matian buat ngelewatin itu semua ba, dan liat sekarang lu udah di hari terakhir di BLI RTB woiii. Thank you udah bertahan dan berjuang bareng sampai di akhir ppbp ini yaa ba. We’re all proud of you, Kaba Saskia!! Selamat belajar banyak hal baru di dunia kerja nanti yaa ba. Semangatt ojt dan kerjanya nanti. Semoga tim tempat kerja lu sangat baik dan support lu. Apapun itu keputusan yang lu ambil ke depannya, ingatlah klo ada amigos yang selalu support lu apapun itu ba. Tetap keep in touch yaa ba, harus hadir tiap anniv yaaa. Ba harus selalu bahagia pokoknya yaaa. May life be kind to you, and may every new chapter bring you closer to all the happiness and success you deserve. Keep being amazing, Kaba!!" },
  { name: "Della", photo: "Foto/della.jpg", letter: "Sawadikap kadekkkk!! *bacanya sambil dengerin lagu everything u are - hindia dek wkwkwkwk Yeyyyyy del lihatlah kamu bisa survive sampai akhir kannn. Congratsss udah mau menamati perjalanan ppbp ini del, kamu keren bangettt del bisa bertarung sampai akhir meskipun banyak HUHA HUHA HUHA WKWKWKWK. Aku tau ini bukan perjalanan yang mudah. Aku tau banyak hal yang udah kamu korbankan. Mungkin banyak sakitnya, banyak hal yang gabisa diutarakan, atau mungkin berulang kali merasa di titik terendah kamu. Tapi kita semua tau kamu udah berusaha sebaik mungkin del, dan kita sangat bangga ngeliat kamu belajar banyak hal sampai hari ini. You deserve all the love, support, and cheers for everything you've worked so hard for! Thank you yaa del udah mewarnai dan meramaikan hari hari nya amigos, amity bakal kurang klo ga ada kamu di dalamnya. Thank youu udah berjuang bareng bareng sampai akhir yaa del. Kita semua sangat senang bisa jadi bagian dalam perjalanan hidup kamu del yippp yippp. Selamat membuka lembaran baru di dunia kerja del. Mungkin akan ada banyak tantangan baru di depan, tapii kita yakin kamu bisa hajarrr sikattt semua del karena kamu adalah kadek della ayu sintya yang sangat amat gacorrr. Ingatlah klo kamu punya amigos yang akan selalu support kamu apapun itu del. Semangattt teruss ya dellaaaa biarlah api di hidup mu menyala terusss. Semoga tim tempat kerja mu nanti sangat baik dan support kamu yaa del. Always love yourself yaa kadekkk, jangan selalu bahagiain orang lain tapii bahagiain dirimu jauh melebihi kamu membahagiakan orang lain. Tetap keep in touch sama amigos yaa, harus selalu dateng tiap reuni pokoknyaa. Keep that fire burning, keep choosing yourself, and never forget how far you've come. The best is yet to come, Kadekkk!" },
  { name: "Kania", photo: "Foto/kania.jpg", letter: "Ni hao kaniakk yellow girlie!! OMGGG wanita pubdok abadi iniii yang sangat amat kerennnn. Congratsss kaniakkk udah mau mengakhiri huru hara ppbp inii. Kan kamu amat sangat keren sumpilll. Kita tau ini bukan perjalanan yang mudah buat kamu. Banyak jatuh bangkit nya, banyak sedih senang nya, tapii lihatlah dirimu sekarang kannn, kamu bisa bertarung sampai akhirrrr. Thank youu udah mau berjuang bersama amigos sampai akhir, thank you udah jadi koor pubdok abadi hehehe, dan thank you udah berbagi banyak cerita bersama amigos kan. Kelas kita bukan amity klo ga ada kamu di dalamnya, thank youu udah mewarnai hari harinya amigos kan. Kita semua tau kok kan bahwa kamu udah melakukan segala sesuatunya dengan semaksimal mungkin, dan kita sangat bangga ngeliat kamu belajar banyak hal sampai saat ini. WoW kaniaa mantap betulll!! Selamat memasuki dunia kerja kan, semangattt terusss. Mungkin akan banyak tantangan baru di depan, tapi kita tau kamu pasti bisa sikatt abiss semua karena kamu adalah kania yang selalu gacorrr. Semoga tetap bisa sering jalan jalan yaa kan biar healing WKWKWK. Semoga tim tempat kerja mu sangat baik dan support kamu yaa. Ingatlah klo kamu punya amigos yang akan selalu support kamu apapun itu kan. Tetap keep in touch sama amigos yaa kan, harus hadir tiap reuni pokoknyaa. Selalu jadi terang dan berkat bagi orang lain yaa kan. Dan ingatlah Tuhan bawa kamu sejauh ini karena ada tujuan, dan rencana Tuhan sangat amat indah buat kamu kania. I hope you never forget how much you've grown and how many beautiful things you've brought into the lives of people around you. Wherever life takes you, always remember that you deserve all the happiness, love, and success coming your way. Keep shining, our yellow girlie!" },
  { name: "Karyn", photo: "Foto/karryn.jpg", letter: "Annyeong kayinnn penguin!! *Lihatlah Dunia - Hivi! Kerennn bingitzz cici fp, komti terkeren cawu 5, wanita tersibuk di A121, pokoknya paling top lah brok. Thank you udah sangat sabar menghadapi orang orang unik yang ada di sini wkwkwk. Thank you udah sangat baik, perhatian, dan banyak bantu amigos yinn. Kayinn kamu keren banget udah bertarung dengan semua rintangan di PPBP inii WoW. Mungkin ada banyak hal yang kamu pendem, banyak ngalah, banyak memaklumi, dan ‘yaudah lah’, tapii keren kamu sangat dewasa euyy teteh bandung ieu. Dan kita semua tau pasti kamu udah mengeluarkan usaha kamu dengan maksimal yin, so proud of you kayinnnn!!! Selamat memulai lembaran cerita baru yinn. Semangatt yaa ojt dan kerjanya nantii. Semoga tim kerja mu nanti sangat baik dan support kamu yaa yin. Ingatlah klo kamu punya amigos yang akan selalu support kamu apapun itu ke depannya. Mungkin akan ada banyak tantangan baru, tapi kamu pasti bisa hajarrr semua laa wkwkwk because kamu adalah karyn susanto yang sangat keren cihuyyy. Haruss dateng tiap anniv yaa!! Tetap keep in touch dengan amigos pokoknyaa!! Love yourself first yaa yinn, dengan kamu sangat mencintai dan membahagiakan dirimu maka orang juga akan merasakan klo kamu ngebahagiain mereka yin. Always remember how amazing you are, and never stop being the wonderful person you are today. Keep shining, Kayinnn!!" },
  { name: "Katherine", photo: "Foto/katherine.jpg", letter: "Haii kejuu cheese wong kito galo!! *bacanya sambil dengerin Terhebat - Coboy Junior ju hihihi Kejuu kamu sangatt kerennn lohhh.. look how much you've grown sejak pertama kali kita di sini. Thank you udah mau saling belajar, berjuang, senang senang, dan banyak hal bareng amigoss. Yeyyy congratsss perjalanan ppbp akan segera berakhir dan memasuki babak baru dalam hidup mu ju. Aku tau pasti susah banget perjalanan di sini ju, tapiii lihatlah diri mu sekarang!! So proud of you kejuuu!! Semangatt OJT dan kerjanya nanti yaa ju. Semoga tim tempat kerjamu nanti sangatt baik dan support kamu. Pastii akan ada banyak sekali tantangan baru ke depannya tapii kamu adalah katherine junitha yang pastii bisa melewati semuanya juu! Ingatlah klo kamu punya amigos yang akan selalu support kamu apapun itu ju. Sangat senang bisa jadi bagian perjalanan hidupmu selama di sini ju. Tetap keep in touch sama amigos yaa, harus ikut tiap anniv loh yaaaa. Selamatt belajar banyak hal baru di dunia kerja kejuu!! Keep growing, keep glowing, and never stop being the amazing Katherine Junitha that we all know and love. Love you, Kejuuu!" },
  { name: "Keisha", photo: "Foto/keisha.jpg", letter: "Haiii keii si softy girl😚😚 *bacanya sambil dengerin Cahaya - Tulus keii hihihi Thank you yaa kei udah jadi doper sejati yang superr baik hati di mana pun dan kapan pun. And thank you buat semua kalimat penyemangat, perhatian, dan apapun itu yang kamu kasih ke orang keii.. Mungkin ada yang biasa aja seneng dikasih perhatian kayak gitu, tapi ada juga yang kalimat se simple itu bisa luar biasa bermakna bagi seseorang soooo thank youu so matcha keiii. Yeyyy congratsss udah berhasil melewati huru hara PPBP selama 2 tahun lebih di sini. Aku tau pasti sangat berat perjalanan yang udah kamu lalui, tapii lihatlah kamu udah mau di akhir perang PPBP ini lohhh. Dan kita semua tau kamu udah berusaha sangat keras dan kasih yang terbaik sampai saat ini. So proud of you, keisha meivianna!! Semangatt yaa OJT selama 2 bulanan ke depan. Selamat belajar banyak hal baru di dunia kerja nanti kei. Semoga tim tempat OJT mu dan kerja mu nanti sangat baik dan saling support yaa. Dan aku sangat berharap kamu selalu di kelilingi orang yang sangat baik luar dan dalamnya seperti kamu keii. Ingatlah klo kamu punya amigos yang selalu support kamu apapun itu. Tetap keep in touch yaa sama amigos, semoga selalu hadir di acara anniv amity sampai kakek nenek wkwkwk. No matter where life takes you, you'll always have a home in AMITY. Love you and God bless you always keiii muahhh" },
  { name: "Laura", photo: "Foto/laura.jpg", letter: "Haiii celorrrr cihuyyyy *bacanya sambil dengerin lagu Ramai Sepi Bersama - Hindia lorr hihihi Aduhh wanita multi talenan iniii WKWKWKWWK. Celorrr kamu sangat amat kerennn jago nyanyi, banyak ide, koor music mv, ngurus perform gradu, dan banyak event lainnya tapii kamu bisa menghandle itu semua dengan sangat amat keren lorrr good jobbb!!! Congratsss udah mau di akhir perang ppbp ini lorr yeyeyeyeyeyyyy. Aku tau ini bukan perjalanan yang mudah, ada banyak bangettt pengorbanan yang kamu lakukan untuk bertahan sampai saat ini, tapiii liatlah diri mu sekarang lorrrr!!!! Kita semua tau kamu udah ngelakuin usaha semaksimal mungkin dan kita semua senang bisa jadi bagian cerita hidupmu di sini lorrr. Thank youu udah menghidupkan suasana kelas ini yaa lor, klo ga ada kamu kayak ada yang kurang dehh (jangan kepedean tapi…) Selamat memulai lembaran cerita baru di dunia kerja yaa lorrr. Semoga tim tempat kerja mu sangat baik dan support kamu yaa. Pasti akan ada banyak rintangan baru nanti, tapii kita tau klo kamu pastii bisa sikatt semuanya lorr karena kamu adalah laura amelia yang selalu gacorrr. Pokoknya harus selalu bahagia yaa lorr dan sukses apapun jalan yang kamu ambil. Tuhan bawa kamu sejauh ini pasti punya maksud dan tujuan, dann Tuhan juga pasti punya rencana yang indah buat kamu lorr. Semangattt loraaaa.. Ingatlah klo kamu punya amigos yang akan selalu support kamu apapun itu. Tetap keep in touch sama amigos yaa lorr, harus hadir tiap anniv pokoknyaaa. May God guide every step you take and lead you to beautiful things beyond your imagination. You deserve all the happiness in the world, Lorrr!" },
  { name: "Lienly", photo: "Foto/lienly.jpg", letter: "Haii liennn!! Si bocil asbun, suara menggelegarrr, dan ketawa karir WKWKWKWK. Tapi dengan adanya orang kayak lu diantara amigos, suasana kelas jadi lebih hidup li karna unik sih lu WKWKWK. Congratsss liennn udah berjuang sampai sejauh ini di sini!! Kita tau lu udah berusaha mati mati li, berulang kali jatuh bangkit lagi, dan mungkin banyak hal yang lu pendem dan lu sampaikan ke Tuhan lewat doa. Apapun itu lien, lu harus selalu inget lu itu kerennn bangettt atas semua usaha lu li. Dan ingettt lu udah berhasil melewati macam macam accounting yang ada di sini lohhh WKWKWK. Good job liennn, and we’re all proud of youuu!!! Selamat memulai lembaran cerita baru di dunia kerja lienn. Semoga tim tempat kerja lu sangat baik dan support lu yaa. Semoga langgeng dan undang amigos dong pas nikahh hehe. Lien apapun tantangan yang ada di depan, kita tau klo lu bokem pasti bisa hajar semuanyaa. Dan lu punya amigos yang akan selalu support lu apapun itu lien. Tetap keep in touch sama amigos yaa lien, harus dateng tiap anniv pokoknyaaaa. Keep growing, keep laughing, and never stop being your wonderfully chaotic self!" },
  { name: "Hanny", photo: "Foto/hanny.jpg", letter: "Heyyyy hanek honey hani hun!! Manusia paling kocak se amigos kalo kata orang-orang. Makasih yaa udah membawa warna baru ke dalam amity, kamu selalu bisa buat suasana happy dan ceria. Meskipun terkadang pasti ada rasa sedih, bingung, stress yg mungkin kamu pendem sendiri dan ga cerita ke siapapun karena takut membebani yang lain, but that’s okay kok to feel sad sometimes. Terkadang kita ga harus pura-pura kuat di depan orang untuk membuktikan itu. Terimakasih yaa sudah mau bertahan bersama-sama dengan Amigos yang lain selama 2 tahun inii, you really did a great job. Selama 2 tahun ini kamu udah melakukan yang terbaik yang kamu bisa dan Amigos are very proud of you, your parents are very proud of you, and God is very proud of what you did in this past 2 years. Tetap semangat terus yah hun dimana pun kamu berada nanti, tetap jadi hanikkkk yang amigos kenalll, tetap tersenyum, tetap bahagia, and always bring the positive energy wherever you are yahhh!! Semoga disegerakan bertemu mas-mas jawa katolik itu HAHAHA. With love, Amigos." },
  { name: "Diva", photo: "Foto/diva.jpg", letter: "Helowww dipsyy, dipengg, dipsypoirot, diva penyanyi!! Manusia paling ekspresif dan selalu bikin mood orang-orang hepi dengan lelucon dan cerita randomnya WKWKKW. Saking randomnya kalo dengerin cerita kamu berasa lagi dengerin stand up comedy dip serius. Si reading holic person yang stok buku dan novelnya udah bisa bikin perpustakaan sendiri. Makasih yaaa dipsyy selama 2 tahun ini kamu selalu spread the positive energy ke orang-orang di sekitar kamuuu, meskipun ga jarang kamu juga suka julid HAHHA tapi gapapa dip itu manusiawi kok. Tapi dibalik itu semua kamu adalah orang yang sangat amat peka dip, makasihh yaa kamu selalu memperhatikan yang lain dan sudah sangat amat peduli dengan orang-orang di sekitar kamuuu. Meskipun begitu tetap ingat to put yourself first yah dip, karena bagaimanapun kebahagiaan diri kamu sendiri adalah hal yang paling penting. Tetap semangat dalam menjalani kehidupan kamu berikutnyaa, and always remember that you are enough and you are strong. Tetap jadi dipsypoirot yang Amigos kenal yahh dengan ketawa khasnya itu, bahagia selalu dipsyyy kamu akan selalu jadi kebanggaan bapak dan ibu kamu, dan adik kamu akan sangat bangga punya sosok kakak yang kuat seperti kamu dip. With love, Amigos." },
  { name: "Nadine", photo: "Foto/nadine.jpg", letter: "There she is Amigos future Make Up Artist Nadine Amandaaa!! Huhu ga kerasa yah din udah 2 tahun aja kamu bersama Amigos, bentar lagi udah mau say bye-bye. Manusia cakepppnya bp 7 sekaligus juga manusia clumsy ini bentar lagi udah mau kerja ajaa. Semoga di tempat ojt maupun tempat kerja ga clumsy lagi yah dinn HAHAHA. Makasihhh yaa nadin udah mau berusaha dan berjuang mati-matian buat sampai di tahap inii. Mungkin gatau udah berapa air mata yang keluar, udah berapa overthinking yg selalu terlitas di benak kamu but you nailed it! Kamu bisa melalui itu semuaa dengan sangat sangat baikk very proud of youuuu. Makasih yaa udah selalu jadi orang yang peduli sama amigos yang lainn, yang selalu effort kalau itu udah berurusan sama makeup. Semangat terus nadinnn, semoga goals kamu untuk menjadi MUA bisa segera terwujud yahhh hihi, semoga porto yang saat ini mungkin masih diisi 1 atau 2 foto nantinya bisa semakin berkembangg sampai puluhan ribuan foto dan juga followerss. Sukses terus yah nadinnn, kamu udah dan akan selalu jadi kebanggaan mama papa kamuu dan koko kamu. Sehat-sehat nadinnn, jaga kesehatan jangan keseringan aslam lagi loh yahh God bless you dinn. With love, Amigos." },
  { name: "Natasha", photo: "Foto/natasha.jpg", letter: "Tashaaa hey hey heyyy ketua MP kita yuhuuu!! Gimanaaa 2 tahun inii? Rasanya kayak campur aduk bgt yah hidup, ada cape, kesel, sedih, bahagia, ovt, dll. Rasa-rasanya hidup tuh kayak lagi diuji gitu ga sih shaa HAHAHA. Tapi aku yakin semua rasa cape itu hilang dengan adanya orang-orang disekitar kamuu yang selalu support, kayak contohnya Amigos yuhuu. Makasih yah shaa udah bertahan sejauh ini bersama-sama dengan Amigos. Orang paling positive vibes yang selalu peduli dengan sekitarnya. Kamu dikelilingi orang-orang baik juga karena you are such kind person to everyone around you. Makasih yaa udah selalu kasih semangat dan support ke orang-orang di sekitar kamu, meskipun mungkin kamu juga butuh untuk disemangatin. Semangat terus shaa kedepannya dalam menjalani kehidupan kamuuu, just remember that wherever you are or wherever you go Amigos always got ur back no matter what. Tetap selalu jadi kebanggaan orangtua kamu yahh shaaa, dan always bring your positive energy, tetap jadi tasha yg Amigos kenal, tasha yang selalu senyum di situasi atau kondisi apapun. Kamu orang baik dan akan selalu jadi orang baik, always put God first yah tashaa semangattt. With love, Amigos." },
  { name: "Nathania", photo: "Foto/nathania.jpg", letter: "Niaaaakk manusia super duper gemes se-bp 7. Niaa si pelopor WOW yang sangat fenomenal dan kece sampai dijadiin dialog perform kelas widihhh keren bgt sih niaak. Manusia dengan seribu ide yang out of the box nya kalau tiap ada tugas kelompok, kamu keren nia Amigos bangga punya kamu. Gimana 2 tahunnya menjalani PPBP inii niaaa, kamu keren bgt tau nia udah bisa survive sampai di tahap iniii. Walaupun pasti ada jatuh bangun, bahkan sedih yang mungkin kamu rasakan tapi kamu keren nia, kamu ga pernah ngeluh, kamu orang paling kuat yang pernah Amigos liat. Kamu selalu jadi orang yang punya pemikiran yang positive dan sangat amat baik ke orang-orang di sekitar kamu. Keluarga kamu pasti bangga sama kamu, papa nia pasti bangga banget anak perempuan sulungnya bisa sampai di tahap ini dan bisa melalui semua rintangan yang ada. Jangan patah semangat yah niaa, kejar cita-cita yang mau kamu capai, selalu jadi kebanggaan mama dan papa kamu terus yah. Masih panjang perjalanan hidup yang akan kamu tempuh kedepannya, dan semua itu butuh semangat yang lebih dari diri kamu. Tetap jadi nia yang Amigos kenal yahh, sampai jumpa di waktu yang terbaik. With love, Amigos." },
  { name: "Nicholle", photo: "Foto/nicholle.jpg", letter: "Heyy nikoll, nick, niki, nicolek, nstiee!! Manusia paling sabar, paling kalem, paling lembut yang pernah Amigos temui. Rasanya kalau liat nikol tuh kayak ngeliat sosok adik kecil karena suka bikin Amigos gemeshhh. Tapi, dibalik itu nikol adalah sosok yang sangat amat dewasa. Makasih yaa nikol udah sabar dan udah mau bertahan selama kurang lebih 2 tahun bersama-sama dengan Amigos. Nikol keren bangettt udah bisa sampai di tahap ini yang dimana bentar lagi udah mau ojt dan penempatan. Meskipun kadang banyak rintangan, banyak ujian berat yang mungkin terasa sangat berat untuk dilewati, tapi ternyata kamu berhasil nik melalui ini semua, congrats yahh. Mami papi kamu super duper bangga punya kamu nikk, nikol anak yang baik, pinter, sabar, anak yang luas hatinya, bahkan kamu peduli terhadap orang-orang di sekitar kamu. Dan ini juga yang membuat kamu dikelilingi orang baik cause you’re good person too. Mungkin setelah ini, kamu akan menghadapi banyak hal baru, lingkungan baru, orang-orang baru, tantangan baru, dan mungkin juga beberapa kegagalan yang ga pernah terpikir sebelumnya. Tapi semoga kamu ga mudah kehilangan kepercayaan terhadap diri sendiri yah nik dan semoga kamu dapet penempatan di tempat yang sesuai dengan yang kamu mau whichis Semarang aminn. Tetap semangat ya nik, tetap rendah hati, dan jangan takut untuk memulai sesuatu dari awal. Tetap jadi nikol yang Amigos kenal, yang selalu berbuat kebaikan ke orang-orang disekitar. Jangan pernah menyerah ya nikk, tetap sehat, tetap semangat dan selalu ingat bahwa kamu punya keluarga yang selalu support dan bangga sama kamu nik. With love, Amigos" },
  { name: "Puspa", photo: "Foto/puspa.jpg", letter: "Om swastiastu kak pande, kakak kita semua hoho! Gimana peng 2 tahun iniii, seneng? sedih? Bahagia? campur aduk? Pasti ada semua lah yaaa, rasanya nano nano gitu yah kak peng. Tapi dibalik itu semua kamu udah keren bangett puspengg udah bisa melalui ini semua, makasihh yaa karna kamu selalu menyebarkan energi positive ke orang-orang di sekitar kamu. Rasanya kalau liat kak puspa tuh lucu aja gitu bawaannya, kalau kata orang zaman now kak puspa tuh “naturally funny” WKWK.  Amigos bakal kangen kelakuan random kamu sih peng aseli. Meskipun kadang kamu pasti pernah ngerasa sedih atau banyak pikiran, tapi kamu ga pernah nunjukin itu ke orang-orang di sekitar kamu, kamu orang yang kuat peng. Tapi sekuat-kuatnya kamu, tolong jangan ditahan yah pengg. Coba untuk cerita ke orang-orang terdekat kamu, mungkin kamu bisa cerita ke ibu kamu atau bapak kamu, intinya jangan dipendem sendiri yaa puspengg. Semangat juga buat kamu kedepannyaa, semoga kamu selalu sukses dimanapun kamu berada nanti, dan selalu jadi berkat bagi orang-orang di sekitar kamu jugaa. Tetap semangat kak pengg, meskipun pasti ga mudah kedepannya dan pasti akan selalu ada rintangan tapi ttp jangan menyerah yah pengg, tetap jadi kak puspa yang Amigos kenal yang selalu ceria dan lucu. Sehat terus puspengg, astungkara penempatan di tempat yang sesuai dengan harapan kamu. With love, Amigos." },
  { name: "Monic", photo: "Foto/monic.jpg", letter: "Monskieeee our ketua mv, our editor, our koor kesdis. Kamu keren banget monikk bisa handle itu semua waktu yang bersamaan. Pastinya ga gampang yah mon buat ngejalanin itu semua, pasti ada kalanya kamu ngerasa cape, drain, lelah, stress, sedih, rasanya mau nyerah aja tapi gabisa. Meskipun begitu kamu ga pernah nunjukkin itu ke orang-orang disekitar kamu . Pasti cape yah monn berpura-pura baik-baik aja padahal aslinya cape banget, gaada yang tau berapa banyak air mata yang udah kamu keluarin, but i wanna say that it’ll be okay monskiee, sometimes it’s okay to not be okay. Selalu ingat mon akan selalu ada pelangi sehabis hujan, jadiii sesedih apapun yang kamu rasakan pasti akan tergantikan dengan hal-hal baik di masa depan nantiii. Kamu keren mon, kamu orang baik, kamu orang yang sangat sabar menghadapi apapun itu situasinya. Mama papa kamu pasti bangga banget ngeliat putri sulung mereka yang dulu masih kecil banget sekarang udah tumbuh beranjak dewasa dan hidup dengan baik. Tetap semangat ya mon menjalani kehidupan kamu selanjutnyaa, semangat terus dalam menjalani ojt nyaa, jangan menyerah ya mon apapun yang terjadii. Semoga kamu dapat penempatannya di tempat yang selama ini kamu harapkan dan semoga kamu bisa bertumbuh menjadi orang yang penuh dengan berkat dan bisa jadi berkat untuk orang-orang di sekitar kamuu. Selalu andalkan Tuhan ya mon di setiap perjalanan hidup kamu, always put God first in every single part of your life. Selalu jadi monik yang Amigos kenal dan selalu ingat bahwa kamu punya orang-orang hebat di sekitar kamu yang selalu support kamu kapanpun dimanapun kamu berada, God loves you mon, your parents love you, your brother loves you, and Amigos will always love you." },
  { name: "Richard", photo: "Foto/richard.jpg", letter: "WOE ICANG KWKWKWKW, makasih ya sudah menjadi salah satu orang yang punya kontribusi besar buat AMI7Y, terutama lewat segala urusan IT kelas yang sudah lu handle selama beberapa cawu ini. Mungkin kelihatannya sederhana, tetapi sebenarnya banyak hal yang membutuhkan waktu, tenaga, dan kesabaran di balik semua itu. We really appreciate every effort you've given! Di balik sosok lu yang bercanda mulu, super ceria, dan friendly sama orang-orang, ada kalanya lu harus menghadapi banyak hal yang nggak selalu berjalan sesuai harapan. Mungkin ada saatnya lu merasa pusing, capek, bahkan mempertanyakan kemampuan diri sendiri karena beberapa hal belum berhasil lu capai. But hey, please don't be too hard on yourself, Chard! Nggak semua hal harus berhasil sesuai waktu dan rencana yang sudah lu susun. Ada banyak hal baik yang tetap bisa lu banggakan dari perjalanan lu sejauh ini, dan jangan sampai hal-hal yang belum tercapai membuat lu lupa sama semua usaha dan kemampuan yang sudah lu punya. Tetap jadi Richard yang penuh humor, ceria, ramah, dan bisa membawa suasana menyenangkan buat orang-orang di sekitar lu, yak! Semoga ke depannya semakin banyak kesempatan baik yang datang, semakin banyak hal yang bisa lu capai, dan semoga lu selalu punya alasan untuk tetap semangat meskipun keadaan kadang nggak sesuai ekspektasi. Thank you for being part of AMI7Y and for all the things you've done. You deserve good things too, Chard! Proud of you, Richard!💪🏻🌻" },
  { name: "Shanessa", photo: "Foto/shanessa.jpg", letter: "Heyooo komti cawu 3 yang super “garanggg” hehehehe. Makasih ya udah mau menyalonkan diri sebagai komti di cawu 3 yang sangat hectic. You did it, Ness! Kamu nggak cuma berhasil menjadi komti, tetapi juga berhasil menjalankan tanggung jawab itu dengan sabar, humble, dan tentunya tegas. Kamu punya peran yang besar banget bagi AMI7Y dan AMIGOS. Terkadang mungkin kamu merasa capek karena kelas kita sangat bandel dan sulit diatur, sampai-sampai harus mengeluarkan ekstra kesabaran buat menghadapi tingkah laku kita semua HAHAHAHA. Mungkin terkadang kamu gampang tersulut emosi, tapi di balik sisi garangmu itu, sebenarnya kamu adalah orang yang ramah, baik, dan perhatian banget sama teman-temanmu. Kamu juga punya cara berpikir yang terkadang dewasa banget dan bisa melihat sesuatu dari sudut pandang yang lebih luas. I hope you never lose that beautiful side of you. Ness, jangan pernah merasa semua usaha dan kesabaranmu selama ini sia-sia, karena sekecil apa pun yang kamu lakukan, semuanya pasti ada hikmahnya. Kamu juga nggak harus selalu kuat dan mengerti keadaan semua orang. Sesekali kamu boleh capek, boleh mengeluh, dan boleh memikirkan dirimu sendiri. Thank you for being our komti and for everything you've done for AMI7Y. Semoga yang kamu ingat dari cawu 3 dan cawu cawu lainnya bukan cuma hectic-nya kelas dan tingkah ajaib AMIGOS OAKWKKWK, tetapi juga semua kenangan baik yang nantinya bisa kita ceritakan sambil tertawa bersama amigos tentunya. Proud of you, Ness! Tetap jadi Shanessa yang dewasa, hangat, perhatian, and of course sedikit garang HEHEHEHE.🌻✨" },
  { name: "Stevie", photo: "Foto/steviee.jpg", letter: "Holaaa pepiiiii! Hehehe. Awal bareng amigos mungkin kamu terlihat agak pendiam yakkk, tapi ternyata makin ke sini makin kelihatan kalau kamu juga punya sisi yang seru polll. Apalagi sekarang sudah semakin akrab sama AMIGOS, jadi makin asik diajak ngobrol, bercanda, dan seru-seruan bareng. Kalo sekarang mah, Stevie kalau sudah kumpul sama teman-teman bisa se-random itu WKKWKWKW. Di balik sisi serumu itu, kamu juga punya pembawaan yang lembut dan perhatian banget sama orang lain. Apalagi selama menjadi doper, terlihat kalau kamu punya kepedulian yang besar terhadap teman-teman dan nggak segan untuk memberikan perhatian kepada orang di sekitarmu. Semoga kamu terus jadi Stevie yang hangat, menyenangkan, dan selalu membawa energi positif buat AMIGOS. Jangan sampai kehilangan sisi lembut dan perhatianmu itu, ya! Thank you for being part of AMI7Y and for all the good memories. Keep being our lovely Stevie, Pepiiii! 🌻💫" },

/* ---------- Kode di bawah ini tidak perlu diubah ---------- */
const $ = (id) => document.getElementById(id);
const placeholder = '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#fef3c7"/><use href="#sunflower" transform="translate(15 15) scale(.7)"/></svg>';

function photoHTML(m) {
  if (!m.photo) return placeholder;
  const img = document.createElement("img");
  img.src = m.photo; img.alt = "Foto " + m.name; img.loading = "lazy";
  img.onerror = () => { img.parentElement.innerHTML = placeholder; };
  return img;
}
function setPhoto(box, m) {
  box.innerHTML = "";
  const p = photoHTML(m);
  typeof p === "string" ? (box.innerHTML = p) : box.appendChild(p);
}

/* Grid */
const grid = $("grid");
MEMBERS.forEach((m, i) => {
  const li = document.createElement("li");
  const btn = document.createElement("button");
  btn.className = "lta-card"; btn.type = "button";
  btn.setAttribute("aria-label", "Buka surat untuk " + m.name);
  btn.innerHTML = '<div class="lta-photo"></div><span class="lta-name"></span>';
  btn.querySelector(".lta-name").textContent = m.name;
  setPhoto(btn.querySelector(".lta-photo"), m);
  btn.addEventListener("click", () => openModal(i));
  li.appendChild(btn); grid.appendChild(li);
});

/* Modal */
const modal = $("modal"); let current = 0, lastFocus = null;
function render(i) {
  current = (i + MEMBERS.length) % MEMBERS.length;
  const m = MEMBERS[current];
  $("m-name").textContent = m.name;
  $("m-letter").textContent = m.letter;
  setPhoto($("m-photo"), m);
}
function openModal(i) {
  lastFocus = document.activeElement; render(i);
  modal.classList.add("open"); document.body.style.overflow = "hidden"; $("m-close").focus();
}
function closeModal() {
  modal.classList.remove("open"); document.body.style.overflow = ""; lastFocus && lastFocus.focus();
}
$("m-close").addEventListener("click", closeModal);
$("m-prev").addEventListener("click", () => render(current - 1));
$("m-next").addEventListener("click", () => render(current + 1));
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowLeft") render(current - 1);
  if (e.key === "ArrowRight") render(current + 1);
});

/* Kelopak jatuh */
const petals = $("petals");
for (let i = 0; i < 18; i++) {
  const p = document.createElement("span");
  p.className = "lta-petal";
  p.style.left = Math.random() * 100 + "vw";
  p.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
  p.style.animationDuration = 9 + Math.random() * 9 + "s";
  p.style.animationDelay = -Math.random() * 15 + "s";
  p.style.scale = 0.7 + Math.random() * 0.8;
  petals.appendChild(p);
}
</script>
